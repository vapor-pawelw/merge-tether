name: Release

on:
  push:
    tags:
      - 'v*'

env:
  RELEASE_REPO: ${{ github.repository }}
  APP_NAME: GitLabTodos

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building ${APP_NAME} ${VERSION}"

      - name: Check distribution configuration
        env:
          APPLE_CERTIFICATES_P12_BASE64: ${{ secrets.APPLE_CERTIFICATES_P12_BASE64 }}
          APPLE_CERTIFICATES_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          NOTARY_API_PRIVATE_KEY: ${{ secrets.NOTARY_API_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_RELEASE_IDENTITY: ${{ vars.MACOS_RELEASE_IDENTITY }}
          IOS_RELEASE_IDENTITY: ${{ vars.IOS_RELEASE_IDENTITY }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
        run: |
          for name in APPLE_CERTIFICATES_P12_BASE64 APPLE_CERTIFICATES_PASSWORD IOS_PROFILE_BASE64 NOTARY_API_PRIVATE_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID APPLE_TEAM_ID MACOS_RELEASE_IDENTITY IOS_RELEASE_IDENTITY IOS_EXPORT_METHOD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing distribution configuration: ${name}. Configure existing distribution credentials before publishing; Apple Development is insufficient."
              exit 1
            fi
          done

      - name: Prepare temporary distribution keychain and provisioning
        env:
          APPLE_CERTIFICATES_P12_BASE64: ${{ secrets.APPLE_CERTIFICATES_P12_BASE64 }}
          APPLE_CERTIFICATES_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          NOTARY_API_PRIVATE_KEY: ${{ secrets.NOTARY_API_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
        run: |
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$APPLE_CERTIFICATES_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.mobileprovision"
          printf '%s' "$NOTARY_API_PRIVATE_KEY" > "$RUNNER_TEMP/notary-key.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$APPLE_CERTIFICATES_PASSWORD" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security cms -D -i "$RUNNER_TEMP/distribution.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PYTHON'
          import os, pathlib, plistlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          with (root / 'profile.plist').open('rb') as source:
              profile = plistlib.load(source)
          team = os.environ['APPLE_TEAM_ID']
          if team not in profile.get('TeamIdentifier', []):
              raise SystemExit('Distribution provisioning profile belongs to another team')
          profiles = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles'
          profiles.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(root / 'distribution.mobileprovision', profiles / (profile['UUID'] + '.mobileprovision'))
          options = {'method': os.environ['IOS_EXPORT_METHOD'], 'teamID': team, 'signingStyle': 'manual',
                     'signingCertificate': 'Apple Distribution', 'destination': 'export',
                     'provisioningProfiles': {'com.vaporpw.MergeTether.iOS': profile['Name']}}
          with (root / 'ExportOptions.plist').open('wb') as target:
              plistlib.dump(options, target)
          PYTHON
          if ! xcrun notarytool store-credentials mergetether-release --key "$RUNNER_TEMP/notary-key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$KEYCHAIN_PATH" >/dev/null 2>&1; then
            echo "::error::Could not validate the configured notarization API credentials."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/notary-key.p8"

      - name: Build separate macOS and iOS distribution artifacts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ github.run_number }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_RELEASE_IDENTITY: ${{ vars.MACOS_RELEASE_IDENTITY }}
          IOS_RELEASE_IDENTITY: ${{ vars.IOS_RELEASE_IDENTITY }}
        run: |
          mise exec -- bash scripts/build-release.sh "$RELEASE_VERSION" --build-number "$RELEASE_BUILD_NUMBER" --platform all \
            --signing-identity "$MACOS_RELEASE_IDENTITY" --ios-signing-identity "$IOS_RELEASE_IDENTITY" \
            --team-id "$APPLE_TEAM_ID" --notary-profile mergetether-release --ios-export-options "$RUNNER_TEMP/ExportOptions.plist"

      - name: Verify distribution inventory and retain stable macOS names
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib
          root = pathlib.Path('release')
          manifest = json.loads((root / 'release-manifest.json').read_text())
          version = os.environ['RELEASE_VERSION']
          expected = {f'GitLabTodos-{version}.dmg', f'GitLabTodos-{version}.zip', f'MergeTetheriOS-{version}.ipa'}
          assert manifest['distributable'] is True
          assert manifest['version'] == version and manifest['build'] == os.environ['RELEASE_BUILD_NUMBER']
          assert len(manifest['artifacts']) == 3 and {item['name'] for item in manifest['artifacts']} == expected
          for item in manifest['artifacts']:
              with (root / item['name']).open('rb') as source:
                  hasher = hashlib.sha256()
                  for chunk in iter(lambda: source.read(1024 * 1024), b''):
                      hasher.update(chunk)
                  digest = hasher.hexdigest()
              assert digest == item['sha256'], 'Artifact digest mismatch'
              if item['platform'] == 'macos':
                  item['name'] = 'GitLabTodos' + pathlib.Path(item['name']).suffix
              (root / (item['name'] + '.sha256')).write_text(digest + '  ' + item['name'] + '\n')
          (root / 'release-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PYTHON
          cp "release/${APP_NAME}-${RELEASE_VERSION}.dmg" "${APP_NAME}.dmg"
          cp "release/${APP_NAME}-${RELEASE_VERSION}.zip" "${APP_NAME}.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE=$(mktemp)
          trap 'rm -f "$NOTES_FILE"' EXIT
          HAS_NOTES=false

          # Preferred source: exact version section from CHANGELOG.md.
          if [ -f CHANGELOG.md ]; then
            if awk -v version="$VERSION" '
              BEGIN { in_version = 0; found = 0 }
              $0 ~ ("^## " version " - ") {
                in_version = 1
                found = 1
                print
                next
              }
              /^## / {
                if (in_version == 1) {
                  exit
                }
              }
              in_version == 1 {
                print
              }
              END {
                if (found == 0) {
                  exit 2
                }
              }
            ' CHANGELOG.md > "$NOTES_FILE"; then
              if [ -s "$NOTES_FILE" ]; then
                HAS_NOTES=true
              fi
            else
              : > "$NOTES_FILE"
            fi
          fi

          # Fallback: annotated tag message, when present.
          if [ "$HAS_NOTES" != "true" ]; then
            TAG_OBJECT_TYPE="$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null || true)"
            if [ "$TAG_OBJECT_TYPE" = "tag" ]; then
              git for-each-ref "refs/tags/${TAG}" --format='%(contents)' > "$NOTES_FILE"
              if [ -s "$NOTES_FILE" ]; then
                HAS_NOTES=true
              fi
            fi
          fi

          if gh release view "$TAG" --repo "$RELEASE_REPO" > /dev/null 2>&1; then
            if [ "$HAS_NOTES" = "true" ]; then
              gh release edit "$TAG" --repo "$RELEASE_REPO" --notes-file "$NOTES_FILE"
            fi
            gh release upload "$TAG" --repo "$RELEASE_REPO" --clobber "${APP_NAME}.dmg" "${APP_NAME}.zip" "release/MergeTetheriOS-${VERSION}.ipa" release/release-manifest.json release/GitLabTodos.dmg.sha256 release/GitLabTodos.zip.sha256 "release/MergeTetheriOS-${VERSION}.ipa.sha256"
          elif [ "$HAS_NOTES" = "true" ]; then
            gh release create "$TAG" \
              --repo "$RELEASE_REPO" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              "${APP_NAME}.dmg" "${APP_NAME}.zip" "release/MergeTetheriOS-${VERSION}.ipa" release/release-manifest.json release/GitLabTodos.dmg.sha256 release/GitLabTodos.zip.sha256 "release/MergeTetheriOS-${VERSION}.ipa.sha256"
          else
            gh release create "$TAG" \
              --repo "$RELEASE_REPO" \
              --title "$TAG" \
              --generate-notes \
              "${APP_NAME}.dmg" "${APP_NAME}.zip" "release/MergeTetheriOS-${VERSION}.ipa" release/release-manifest.json release/GitLabTodos.dmg.sha256 release/GitLabTodos.zip.sha256 "release/MergeTetheriOS-${VERSION}.ipa.sha256"
          fi

      - name: Remove temporary distribution credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" >/dev/null 2>&1 || true
          if [[ -f "$RUNNER_TEMP/profile.plist" ]]; then
            PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/distribution.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/ExportOptions.plist"

  # Updates the Homebrew tap only if HOMEBREW_TAP_TOKEN is configured.
  # Without the token this job fails on checkout, so guard on the secret being
  # present by checking a dummy env var that the repo owner sets alongside it.
  update-cask:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.HOMEBREW_TAP_ENABLED == 'true' }}
    steps:
      - name: Wait for release assets
        run: sleep 10

      - name: Get release info
        id: release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          ASSET_URL="https://github.com/${{ env.RELEASE_REPO }}/releases/download/${TAG}/GitLabTodos.dmg"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"

      - name: Download release asset and compute SHA256
        id: sha
        run: |
          curl -sSL "${{ steps.release.outputs.asset_url }}" -o GitLabTodos.dmg
          SHA=$(sha256sum GitLabTodos.dmg | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: vapor-pawelw/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update cask formula
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          ASSET_URL="${{ steps.release.outputs.asset_url }}"
          sed -i "s/version \".*\"/version \"$VERSION\"/" homebrew-tap/Casks/gitlab-todos.rb
          sed -i "s/sha256 \".*\"/sha256 \"$SHA\"/" homebrew-tap/Casks/gitlab-todos.rb
          sed -i "s|url \".*\".*|url \"$ASSET_URL\"|" homebrew-tap/Casks/gitlab-todos.rb
          cat homebrew-tap/Casks/gitlab-todos.rb

      - name: Commit and push cask update
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/gitlab-todos.rb
          git commit -m "Update gitlab-todos to ${{ steps.release.outputs.version }}"
          git push
