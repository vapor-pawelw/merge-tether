name: Release

on:
  push:
    tags:
      - 'v*'

env:
  RELEASE_REPO: ${{ github.repository }}
  APP_NAME: MergeTether

permissions:
  contents: write

jobs:
  # The tagged commit must pass full verification before any distribution secret is used.
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    runs-on: macos-15
    outputs:
      dmg_sha256: ${{ steps.inventory.outputs.dmg_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check English and Polish localizations
        run: python3 -m unittest discover -s Tests/TestTools -p test_localizations.py

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building ${APP_NAME} ${VERSION}"

      - name: Check distribution configuration
        env:
          MACOS_AD_HOC: ${{ vars.MERGETETHER_MACOS_AD_HOC_TAG == github.ref_name }}
          APPLE_CERTIFICATES_P12_BASE64: ${{ secrets.APPLE_CERTIFICATES_P12_BASE64 }}
          APPLE_CERTIFICATES_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
          NOTARY_API_PRIVATE_KEY: ${{ secrets.NOTARY_API_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_RELEASE_IDENTITY: ${{ vars.MACOS_RELEASE_IDENTITY }}
          MERGETETHER_SPARKLE_PUBLIC_KEY: ${{ vars.MERGETETHER_SPARKLE_PUBLIC_KEY }}
          MERGETETHER_SPARKLE_PRIVATE_KEY: ${{ secrets.MERGETETHER_SPARKLE_PRIVATE_KEY }}
        run: |
          required=(MERGETETHER_SPARKLE_PUBLIC_KEY MERGETETHER_SPARKLE_PRIVATE_KEY)
          if [[ "${MACOS_AD_HOC:-false}" != true ]]; then
            required+=(APPLE_CERTIFICATES_P12_BASE64 APPLE_CERTIFICATES_PASSWORD NOTARY_API_PRIVATE_KEY
              NOTARY_KEY_ID NOTARY_ISSUER_ID APPLE_TEAM_ID MACOS_RELEASE_IDENTITY)
          fi
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing distribution configuration: ${name}."
              exit 1
            fi
          done

      - name: Prepare temporary macOS distribution keychain
        if: vars.MERGETETHER_MACOS_AD_HOC_TAG != github.ref_name
        env:
          APPLE_CERTIFICATES_P12_BASE64: ${{ secrets.APPLE_CERTIFICATES_P12_BASE64 }}
          APPLE_CERTIFICATES_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
          NOTARY_API_PRIVATE_KEY: ${{ secrets.NOTARY_API_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$APPLE_CERTIFICATES_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$NOTARY_API_PRIVATE_KEY" > "$RUNNER_TEMP/notary-key.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$APPLE_CERTIFICATES_PASSWORD" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          if ! xcrun notarytool store-credentials mergetether-release --key "$RUNNER_TEMP/notary-key.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$KEYCHAIN_PATH" >/dev/null 2>&1; then
            echo "::error::Could not validate the configured notarization API credentials."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/notary-key.p8"

      - name: Build macOS distribution artifacts without a relay
        env:
          MACOS_AD_HOC: ${{ vars.MERGETETHER_MACOS_AD_HOC_TAG == github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ github.run_number }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_RELEASE_IDENTITY: ${{ vars.MACOS_RELEASE_IDENTITY }}
          TUIST_MERGETETHER_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
          TUIST_MERGETETHER_UPDATE_PUBLIC_KEY: ${{ vars.MERGETETHER_SPARKLE_PUBLIC_KEY }}
          TUIST_MERGETETHER_MACOS_CRASH_DSN: ${{ vars.MERGETETHER_MACOS_CRASH_DSN }}
          MERGETETHER_CRASH_SYMBOLS_DIR: ${{ vars.MERGETETHER_MACOS_CRASH_DSN != '' && format('{0}/mergetether-crash-symbols', runner.temp) || '' }}
        run: |
          if [[ "${MACOS_AD_HOC:-false}" == true ]]; then
            signing=(--macos-ad-hoc)
          else
            signing=(--signing-identity "$MACOS_RELEASE_IDENTITY" --team-id "$APPLE_TEAM_ID"
              --notary-profile mergetether-release)
          fi
          mise exec -- bash scripts/build-release.sh "$RELEASE_VERSION" --build-number "$RELEASE_BUILD_NUMBER" --platform macos --no-relay \
            "${signing[@]}"

      - name: Install the Sentry CLI
        if: vars.MERGETETHER_MACOS_CRASH_DSN != ''
        run: brew install getsentry/tools/sentry-cli

      - name: Upload macOS crash symbols
        if: vars.MERGETETHER_MACOS_CRASH_DSN != ''
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ github.run_number }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.MERGETETHER_SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.MERGETETHER_SENTRY_MACOS_PROJECT }}
        run: |
          : "${SENTRY_AUTH_TOKEN:?Configure the Sentry CI token}"
          : "${SENTRY_ORG:?Configure the Sentry organization}"
          : "${SENTRY_PROJECT:?Configure the macOS Sentry project}"
          SYMBOLS_DIR="$RUNNER_TEMP/mergetether-crash-symbols/MergeTether-${RELEASE_VERSION}-${RELEASE_BUILD_NUMBER}-macos"
          sentry-cli debug-files upload --wait "$SYMBOLS_DIR/MergeTether.app.dSYM"

      - name: Verify distribution inventory and retain stable macOS names
        id: inventory
        env:
          MACOS_AD_HOC: ${{ vars.MERGETETHER_MACOS_AD_HOC_TAG == github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib
          root = pathlib.Path('release')
          manifest = json.loads((root / 'release-manifest.json').read_text())
          version = os.environ['RELEASE_VERSION']
          expected = {f'MergeTether-{version}.dmg': 'macos', f'MergeTether-{version}.zip': 'macos'}
          assert manifest['distributable'] is True
          assert manifest['macos_notarized'] is (os.environ.get('MACOS_AD_HOC', 'false') != 'true')
          assert manifest['version'] == version and manifest['build'] == os.environ['RELEASE_BUILD_NUMBER']
          assert len(manifest['artifacts']) == len(expected)
          assert {item['name']: item['platform'] for item in manifest['artifacts']} == expected
          for item in manifest['artifacts']:
              with (root / item['name']).open('rb') as source:
                  hasher = hashlib.sha256()
                  for chunk in iter(lambda: source.read(1024 * 1024), b''):
                      hasher.update(chunk)
                  digest = hasher.hexdigest()
              assert digest == item['sha256'], 'Artifact digest mismatch'
              item['name'] = 'MergeTether' + pathlib.Path(item['name']).suffix
              (root / (item['name'] + '.sha256')).write_text(digest + '  ' + item['name'] + '\n')
          (root / 'release-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PYTHON
          cp "release/${APP_NAME}-${RELEASE_VERSION}.dmg" "${APP_NAME}.dmg"
          cp "release/${APP_NAME}-${RELEASE_VERSION}.zip" "${APP_NAME}.zip"
          DMG_SHA256="$(awk '{print $1}' release/MergeTether.dmg.sha256)"
          [[ "$DMG_SHA256" =~ ^[a-f0-9]{64}$ ]]
          echo "dmg_sha256=${DMG_SHA256}" >> "${GITHUB_OUTPUT:-/dev/null}"

      - name: Sign and verify the macOS update feed
        env:
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_BUILD_NUMBER: ${{ github.run_number }}
          MERGETETHER_SPARKLE_PRIVATE_KEY: ${{ secrets.MERGETETHER_SPARKLE_PRIVATE_KEY }}
        run: bash scripts/generate-update-feed.sh "${APP_NAME}.zip" release "$RELEASE_REPO" "$TAG" "$RELEASE_BUILD_NUMBER"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ASSETS=("${APP_NAME}.dmg" "${APP_NAME}.zip" release/release-manifest.json release/appcast.xml
            release/MergeTether.dmg.sha256 release/MergeTether.zip.sha256)
          NOTES_FILE=$(mktemp)
          trap 'rm -f "$NOTES_FILE"' EXIT
          HAS_NOTES=false

          # Preferred source: exact version section from CHANGELOG.md.
          if [ -f CHANGELOG.md ]; then
            if awk -v version="$VERSION" '
              BEGIN { in_version = 0; found = 0 }
              $0 ~ ("^## " version " - ") {
                in_version = 1
                found = 1
                print
                next
              }
              /^## / {
                if (in_version == 1) {
                  exit
                }
              }
              in_version == 1 {
                print
              }
              END {
                if (found == 0) {
                  exit 2
                }
              }
            ' CHANGELOG.md > "$NOTES_FILE"; then
              if [ -s "$NOTES_FILE" ]; then
                HAS_NOTES=true
              fi
            else
              : > "$NOTES_FILE"
            fi
          fi

          # Fallback: annotated tag message, when present.
          if [ "$HAS_NOTES" != "true" ]; then
            TAG_OBJECT_TYPE="$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null || true)"
            if [ "$TAG_OBJECT_TYPE" = "tag" ]; then
              git for-each-ref "refs/tags/${TAG}" --format='%(contents)' > "$NOTES_FILE"
              if [ -s "$NOTES_FILE" ]; then
                HAS_NOTES=true
              fi
            fi
          fi

          if DRAFT=$(gh release view "$TAG" --repo "$RELEASE_REPO" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$DRAFT" != "true" ]; then
              echo '::error::Release is already published. The update archive and its signed feed must stay paired.'
              exit 1
            fi
            if [ "$HAS_NOTES" = "true" ]; then
              gh release edit "$TAG" --repo "$RELEASE_REPO" --notes-file "$NOTES_FILE"
            fi
            gh release upload "$TAG" --repo "$RELEASE_REPO" --clobber "${ASSETS[@]}"
          elif [ "$HAS_NOTES" = "true" ]; then
            gh release create "$TAG" \
              --repo "$RELEASE_REPO" \
              --title "$TAG" \
              --draft \
              --notes-file "$NOTES_FILE" \
              "${ASSETS[@]}"
          else
            gh release create "$TAG" \
              --repo "$RELEASE_REPO" \
              --title "$TAG" \
              --draft \
              --generate-notes \
              "${ASSETS[@]}"
          fi
          HAS_IOS_ASSETS="$(gh release view "$TAG" --repo "$RELEASE_REPO" --json assets \
            --jq 'any(.assets[].name; ascii_downcase | (endswith(".ipa") or startswith("mergetetherios-")))')"
          if [ "$HAS_IOS_ASSETS" != "false" ]; then
            echo '::error::The draft contains iOS assets. Remove them before publishing the macOS release.'
            exit 1
          fi
          gh release edit "$TAG" --repo "$RELEASE_REPO" --draft=false --latest

      - name: Remove temporary distribution credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/notary-key.p8"

  # Updates the Homebrew tap when the repository variable HOMEBREW_TAP_ENABLED is
  # 'true'; it then requires the HOMEBREW_TAP_TOKEN secret (push access to the tap).
  update-cask:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.HOMEBREW_TAP_ENABLED == 'true' }}
    steps:
      - name: Checkout cask template
        uses: actions/checkout@v4

      - name: Get release info
        id: release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          ASSET_URL="https://github.com/${{ env.RELEASE_REPO }}/releases/download/${TAG}/MergeTether.dmg"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"

      - name: Download release asset and verify SHA256
        id: sha
        env:
          ASSET_URL: ${{ steps.release.outputs.asset_url }}
          EXPECTED_SHA256: ${{ needs.build.outputs.dmg_sha256 }}
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 \
            "$ASSET_URL" -o MergeTether.dmg
          SHA=$(sha256sum MergeTether.dmg | awk '{print $1}')
          if [[ ! "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ || "$SHA" != "$EXPECTED_SHA256" ]]; then
            echo "::error::Downloaded MergeTether.dmg does not match the digest built by this workflow."
            exit 1
          fi
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: vapor-pawelw/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update cask formula
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          ASSET_URL="${{ steps.release.outputs.asset_url }}"
          cp dist/homebrew/mergetether.rb homebrew-tap/Casks/mergetether.rb
          sed -i "s/version \".*\"/version \"$VERSION\"/" homebrew-tap/Casks/mergetether.rb
          sed -i "s/sha256 \".*\"/sha256 \"$SHA\"/" homebrew-tap/Casks/mergetether.rb
          sed -i "s|url \".*\".*|url \"$ASSET_URL\"|" homebrew-tap/Casks/mergetether.rb
          cat homebrew-tap/Casks/mergetether.rb

      - name: Commit and push cask update
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 - <<'PYTHON'
          import json
          from pathlib import Path

          path = Path("cask_renames.json")
          renames = json.loads(path.read_text()) if path.exists() else {}
          for token, target in renames.items():
              if target == "gitlab-todos":
                  renames[token] = "mergetether"
          renames["gitlab-todos"] = "mergetether"
          path.write_text(json.dumps(renames, indent=2, sort_keys=True) + "\n")
          PYTHON
          git rm --ignore-unmatch Casks/gitlab-todos.rb
          git add Casks/mergetether.rb cask_renames.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update mergetether to ${{ steps.release.outputs.version }}"
          git push
